name: CD

# Único workflow que corre en el runner autoalojado. Dispara cuando CI termina
# sobre un push a main, nunca por pull_request: es lo que permite tener un
# runner autoalojado en un repositorio público sin exponerlo a código de un
# fork. No agregar aquí ningún trigger de pull_request ni pull_request_target.
#
# Antes disparaba directo por push, en paralelo con CI: un commit con las
# pruebas en rojo llegaba igual a producción. `workflow_run` además corre
# siempre la versión de este archivo que está en main, nunca la del commit que
# lo disparó.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # Enables manual triggering

# No cancela un despliegue en curso ante un push nuevo: dejar que termine
# `docker compose up --build` en vez de interrumpirlo a mitad de camino.
concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  # `workflow_run` no acepta `paths`, así que el filtro de rutas vive acá: se
  # despliega si el commit cambió algo desplegable desde el último CD exitoso.
  # Un CD exitoso que no desplegó igual sirve de base, porque significa que lo
  # desplegable de su commit ya era lo de producción.
  #
  # Corre en un runner de GitHub y no en el autoalojado: no necesita nada del
  # host, y así el runner de producción solo arranca cuando hay qué desplegar.
  gate:
    name: ¿Hay qué desplegar?
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    permissions:
      actions: read
      contents: read
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="$(gh run list --workflow cd.yml --branch main --status success \
            --limit 1 --json headSha --jq '.[0].headSha // empty')"
          # Sin base conocida (primer despliegue, historia reescrita) se
          # despliega: equivocarse para ese lado solo cuesta un rebuild.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # test/ y tool/ no entran a la imagen (ver .dockerignore): un commit
          # que solo los toca no cambia nada en producción.
          if git diff --quiet "$base" HEAD -- \
              packages/dnd_server packages/dnd_app packages/dnd_engine \
              ':(exclude,glob)packages/*/test/**' \
              ':(exclude,glob)packages/*/tool/**' \
              docker-compose.yml postgres-init .github/workflows/cd.yml; then
            echo "Nada desplegable cambió desde $base"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # El commit que CI validó, no la punta de main: si entró otro push
          # mientras tanto, su propio CI dispara su propio despliegue.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # No limpiar el workspace del runner: `.env`, `cloudflared/config.yml`
          # y `cloudflared/creds.json` no están versionados (ver
          # docs/despliegue.md) y viven a propósito dentro de este mismo
          # directorio de trabajo, colocados una vez por quien aprovisiona el
          # runner. `clean: true` (el default) correría `git clean -ffdx` y
          # los borraría antes de cada despliegue.
          clean: false

      - name: Reconstruir y levantar el stack
        # `docker compose up --build` reutiliza cualquier imagen base ya
        # cacheada en el runner para las etapas `FROM` del Dockerfile
        # (ghcr.io/cirruslabs/flutter:stable, dart:stable), aunque esas
        # etiquetas floten en el registro. Eso hizo fallar el build cuando
        # `dnd_app` subió su cota de SDK y el `stable` de Flutter cacheado
        # localmente quedó atrás. `--pull` en `up` solo afecta a servicios con
        # `image:`, no a las etapas de build; `compose build --pull` es lo que
        # fuerza a repreguntar el registro por esas imágenes base antes de
        # construir.
        #
        # Repreguntar no alcanza si la cota de SDK exige un hotfix de Flutter:
        # cirruslabs no publica esos tags (ver el Dockerfile), así que el
        # `stable` más nuevo sigue quedando corto. Ese caso se arregla en el
        # `pubspec.yaml`, no acá.
        run: |
          docker compose build --pull
          docker compose up -d

      - name: Esperar a que el servicio quede saludable
        # No hay puertos publicados al host (ver capacidad
        # self-hosted-deployment), así que no se puede pedir /health por HTTP
        # desde afuera del contenedor. En vez de reimplementar ese chequeo,
        # se lee el resultado del healthcheck que docker-compose.yml ya
        # define sobre ese mismo endpoint.
        run: |
          for i in $(seq 1 30); do
            cid="$(docker compose ps -q server)"
            status="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || echo "starting")"
            if [ "$status" = "healthy" ]; then
              echo "Servicio saludable"
              exit 0
            fi
            sleep 10
          done
          echo "El servicio no quedó saludable a tiempo (último estado: ${status:-desconocido})" >&2
          echo "--- docker compose ps ---" >&2
          docker compose ps >&2 || true
          echo "--- docker compose logs --tail=50 server ---" >&2
          docker compose logs --tail=50 server >&2 || true
          exit 1
