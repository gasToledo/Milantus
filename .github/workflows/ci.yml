name: CI

# Corre en cada push y cada pull request, sin filtro de ruta: la pregunta que
# responde es "¿rompí algo?", no "¿esto necesita llegar a producción?".
# Siempre en runners alojados por GitHub, nunca en el runner autoalojado de
# despliegue — este workflow reacciona a pull_request, que puede venir de un
# fork.
on:
  push:
  pull_request:
  workflow_dispatch: # Enables manual triggering

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dnd_engine:
    name: dnd_engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dnd_engine
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
      # `pubspec.lock` está versionado, así que la clave cambia exactamente
      # cuando cambian las dependencias resueltas. El `restore-keys` deja
      # partir del cache anterior y bajar solo lo que se movió.
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-dnd_engine-${{ hashFiles('packages/dnd_engine/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-dnd_engine-
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: dart test

  # La app es el camino largo de CI, y CD lo espera entero. Por eso las
  # pruebas van en dos mitades y el build web en paralelo con ellas: el tiempo
  # pasa a ser el de la mitad más lenta y no la suma de todo.
  dnd_app:
    name: dnd_app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dnd_app
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Sin esto cada corrida vuelve a bajar el SDK entero de Flutter.
          # `cache: true` guarda el SDK y el pub-cache; las claves por defecto
          # ya incluyen canal, versión, arquitectura y el hash de los
          # `pubspec`, así que una subida de cota de SDK invalida la entrada
          # sola y no hay clave que mantener a mano.
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter build web --release

  dnd_app_test:
    name: dnd_app test (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1]
    defaults:
      run:
        working-directory: packages/dnd_app
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --total-shards=2 --shard-index=${{ matrix.shard }}

  dnd_server:
    name: dnd_server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dnd_server
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-dnd_server-${{ hashFiles('packages/dnd_server/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-dnd_server-
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib bin test
      - run: dart analyze
      - run: dart test

  # Cliente React (`/v2`, ver `docs/operaciones/despliegue.md`). El build ya
  # corre `tsc --noEmit`; se deja el paso aparte para que un error de tipos
  # se lea como tal y no enterrado en la salida de Vite.
  dnd_web:
    name: dnd_web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dnd_web
    steps:
      - uses: actions/checkout@v6
      # El motor JS (`src/engine/dnd_engine.generated.js`) no se versiona y
      # `tsc` y Vite lo importan: hay que generarlo antes. Se compila acá y no
      # se pasa como artefacto de `engine_js` porque ese job espera a los
      # fixtures de paridad y un `needs` serializaría el CI por un solo archivo.
      - uses: dart-lang/setup-dart@v1
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-dnd_engine-${{ hashFiles('packages/dnd_engine/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-dnd_engine-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/dnd_web/package-lock.json
      - run: npm ci
      - run: npm run build:engine
      - run: npx tsc --noEmit
      - run: npm run build

  # Paridad del motor compilado a JS (`dart compile js`, ver `js/entrypoint.dart`
  # en dnd_engine): el cliente React calcula las fichas con ese JS, así que una
  # diferencia con Dart es un número distinto en pantalla. Los casos y la
  # salida esperada los genera Dart; Node los recalcula con el JS y compara el
  # JSON completo. Es la red del tipo escrito a mano de `src/engine/types.ts`:
  # un campo nuevo en `ComputedSheet.toJson` rompe acá aunque el tipo no lo diga.
  engine_js:
    name: engine_js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-dnd_engine-${{ hashFiles('packages/dnd_engine/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-dnd_engine-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/dnd_web/package-lock.json
      - run: dart pub get
        working-directory: packages/dnd_engine
      - run: dart run tool/generate_js_parity_fixtures.dart "$RUNNER_TEMP/parity"
        working-directory: packages/dnd_engine
      - run: npm ci
        working-directory: packages/dnd_web
      - run: npm run build:engine
        working-directory: packages/dnd_web
      - run: npm run test:parity -- "$RUNNER_TEMP/parity"
        working-directory: packages/dnd_web

  # Prueba de humo del cliente React contra el servidor de verdad (el
  # `buildHandler` real con repositorios en memoria y una sesión falsa, ver
  # `packages/dnd_server/test/e2e_server.dart`): sirve el build de `/v2` y el
  # test verifica que se vea la sesión iniciada. Una sola prueba a propósito:
  # lo que cubre es que el cableado servidor ↔ build ↔ cookie funcione.
  web_e2e:
    name: web_e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-dnd_server-${{ hashFiles('packages/dnd_server/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-dnd_server-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/dnd_web/package-lock.json
      - run: dart pub get
        working-directory: packages/dnd_server
      - run: npm ci
        working-directory: packages/dnd_web
      # Antes del build: Vite importa el JS del motor, que no se versiona.
      # `build:engine` corre su propio `dart pub get` en dnd_engine.
      - run: npm run build:engine
        working-directory: packages/dnd_web
      - run: npm run build
        working-directory: packages/dnd_web
      # Sin caché del navegador: son ~150 MB y la descarga tarda menos que
      # restaurar y validar la caché.
      - run: npx playwright install --with-deps chromium
        working-directory: packages/dnd_web
      - run: npm run test:e2e
        working-directory: packages/dnd_web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: packages/dnd_web/test-results
          if-no-files-found: ignore
