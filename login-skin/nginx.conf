# Se interpone entre cloudflared y zitadel-login para dos cosas que el túnel
# no hace (ver login-skin/README.md):
#
#   1. Servir los estáticos de la personalización bajo el mismo hostname que
#      el login. La CSP del login solo admite imágenes, fuentes y hojas de
#      estilo del mismo origen (`'self'`): un fondo servido desde
#      APP_PUBLIC_DOMAIN quedaría bloqueado.
#   2. Agregar el <link> a esa hoja de estilos en cada página HTML del login.

server {
  listen 8080;
  server_tokens off;

  # DNS interno de Docker. Con el upstream en una variable, nginx resuelve el
  # nombre en cada pedido (respetando `valid`) en vez de una sola vez al
  # arrancar. Sin esto, al recrear zitadel-login (por ejemplo al actualizar
  # Zitadel) el contenedor cambia de IP y nginx sigue apuntando a la vieja:
  # 502 hasta reiniciar el proxy. También evita que nginx se niegue a
  # arrancar si zitadel-login todavía no existe.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $login http://zitadel-login:3000;

  location /ui/v2/login/milantus/ {
    alias /usr/share/nginx/milantus/;
    # Corto a propósito: así un cambio de estilo llega a los navegadores en
    # una hora como mucho, sin tener que versionar los nombres de archivo.
    expires 1h;
  }

  location / {
    proxy_pass $login;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # El login compara el Origin de las server actions de Next.js con el host
    # del pedido: tiene que seguir viendo el hostname público, no
    # `login-proxy`. cloudflared ya manda Host y X-Forwarded-Proto originales.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # sub_filter no puede reescribir una respuesta comprimida, así que se le
    # pide al login sin comprimir. Hacia el navegador comprime Cloudflare.
    proxy_set_header Accept-Encoding "";

    # Solo actúa sobre text/html (default de sub_filter_types): los chunks de
    # JS, el CSS de Next y las respuestas RSC pasan intactos.
    sub_filter_once on;
    sub_filter '</head>' '<link rel="stylesheet" href="/ui/v2/login/milantus/login.css"></head>';
  }
}
