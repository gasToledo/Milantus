name: dnd_app
description: "Cliente Flutter Web de fichas D&D 5e conectado al servidor Milantus."
publish_to: 'none'
version: 0.20.0+1

environment:
  # No subir a un patch (3.12.2) sin necesidad real: las imágenes
  # `ghcr.io/cirruslabs/flutter` que usa el Dockerfile solo publican los minor
  # (`3.44.0` = Dart 3.12.0), nunca los hotfix, así que una cota de patch
  # rompe el build del contenedor aunque el SDK local la cumpla.
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # `intl` lo fija `flutter_localizations` (SDK): una cota propia rompería el
  # `pub get` en cuanto el SDK suba, así que se deja en `any`.
  intl: any
  http: ^1.2.2
  dnd_engine:
    path: ../dnd_engine
  archive: 4.0.9
  file_picker: ^8.1.6
  package_info_plus: ^9.0.1
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - packages/dnd_engine/assets/srd_2024/manifest.json
    - packages/dnd_engine/assets/srd_2024/races.json
    - packages/dnd_engine/assets/srd_2024/classes.json
    - packages/dnd_engine/assets/srd_2024/subclasses.json
    - packages/dnd_engine/assets/srd_2024/lineages.json
    - packages/dnd_engine/assets/srd_2024/backgrounds.json
    - packages/dnd_engine/assets/srd_2024/feats.json
    - packages/dnd_engine/assets/srd_2024/weapons.json
    - packages/dnd_engine/assets/srd_2024/armor.json
    - packages/dnd_engine/assets/srd_2024/items.json
    - packages/dnd_engine/assets/srd_2024/magic_items.json
    - packages/dnd_engine/assets/srd_2024/efa_magic_items.json
    - packages/dnd_engine/assets/srd_2024/spells.json
    - packages/dnd_engine/assets/srd_2024/creatures.json
    # Superposiciones en inglés: se piden solo con la interfaz en inglés
    # (ver `asset_content_loader.dart`). Declarar una que no existe rompe el
    # build, así que se suman al crearlas.
    - packages/dnd_engine/assets/srd_2024/races.en.json
    - packages/dnd_engine/assets/srd_2024/classes.en.json
    - packages/dnd_engine/assets/srd_2024/subclasses.en.json
    - packages/dnd_engine/assets/srd_2024/lineages.en.json
    - packages/dnd_engine/assets/srd_2024/backgrounds.en.json
    - packages/dnd_engine/assets/srd_2024/feats.en.json
    - packages/dnd_engine/assets/srd_2024/weapons.en.json
    - packages/dnd_engine/assets/srd_2024/armor.en.json
    - packages/dnd_engine/assets/srd_2024/items.en.json
    - packages/dnd_engine/assets/srd_2024/magic_items.en.json
    - packages/dnd_engine/assets/srd_2024/efa_magic_items.en.json
    - packages/dnd_engine/assets/srd_2024/spells.en.json
    - packages/dnd_engine/assets/srd_2024/creatures.en.json
