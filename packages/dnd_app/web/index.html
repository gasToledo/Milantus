<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Milantus — Asistente de Aventuras: fichas de personaje de D&amp;D 5e con las reglas de 2024.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Milantus">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Milantus — Asistente de Aventuras</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#151210">

  <!--
    El primer cuadro de Flutter tarda: hasta que llega, el navegador pinta el
    fondo por defecto, que es blanco. Contra un tema oscuro eso es un
    fogonazo en la cara cada vez que se abre la aplicación.

    El fondo va acá, en el HTML, y no en Dart: cuando Dart puede pintar algo
    el problema ya pasó. Los colores son los mismos que `AppTheme.dark`
    (`scaffold` y `gold`), así que la pantalla de carga y la aplicación no se
    ven como dos productos distintos.

    El sello es el mismo del panel lateral (`_SealPainter`), en SVG en línea:
    sin imágenes que pedir ni fuentes que esperar. Late despacio para que se
    note que algo está pasando, y se queda quieto si el sistema pide menos
    movimiento.
  -->
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background-color: #151210; }
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; background-color: #151210;
    }
    #splash svg {
      width: 56px; height: 56px; animation: splash-pulse 1.4s ease-in-out infinite;
    }
    @keyframes splash-pulse {
      0%, 100% { opacity: .35; }
      50%      { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash svg { animation: none; opacity: .8; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-label="Cargando Milantus" role="status">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="53" fill="none" stroke="#C9A24B" stroke-width="5"/>
      <g fill="#C9A24B" stroke="#151210" stroke-width="3">
        <path d="M60 0l7 7-7 7-7-7z"/><path d="M113 53l7 7-7 7-7-7z"/>
        <path d="M60 106l7 7-7 7-7-7z"/><path d="M7 53l7 7-7 7-7-7z"/>
      </g>
      <path d="M37 82V38l23 24 23-24v44" fill="none" stroke="#C9A24B"
        stroke-width="9" stroke-linejoin="miter" stroke-linecap="square"/>
    </svg>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
